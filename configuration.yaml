default_config:

frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  dashboards:
    lovelace-home:
      mode: yaml
      filename: lovelace/home.yaml
      title: Home
      icon: mdi:home-outline

homekit:
  filter:
    include_entities:
      - script.hello
      - script.goodbye

shell_command:
  git_pull_config: "git -C /config pull --rebase"

# Scraped by the otel-collector add-on via the Supervisor proxy, then forwarded
# to Dynatrace as OTLP metrics. Entity labels survive as dimensions.
prometheus:
  namespace: hass
  filter:
    exclude_entity_globs:
      # Street-level location — deliberately not shipped off-box.
      - sensor.*_geocoded_location
      # Always empty or unavailable; pure noise.
      - sensor.*_color_options

# Deploy markers, posted to the local OTel collector as an OTLP/JSON log
# record. HA Core runs host-network on HAOS, so localhost:4318 reaches the
# add-on's mapped port. No Dynatrace credential lives in HA — the collector
# attaches auth on export.
rest_command:
  dynatrace_event:
    url: "http://localhost:4318/v1/logs"
    method: POST
    content_type: "application/json"
    # to_json quotes and escapes — detail carries raw command output.
    payload: >-
      {
        "resourceLogs": [{
          "resource": {"attributes": [
            {"key": "service.name", "value": {"stringValue": "home-assistant"}}
          ]},
          "scopeLogs": [{"logRecords": [{
            "timeUnixNano": "{{ (now().timestamp() * 1000000000) | int }}",
            "severityText": "INFO",
            "body": {"stringValue": {{ title | to_json }}},
            "attributes": [
              {"key": "event.type", "value": {"stringValue": {{ event_type | default('CUSTOM_INFO') | to_json }}}},
              {"key": "event.detail", "value": {"stringValue": {{ detail | default('') | string | to_json }}}}
            ]
          }]}]
        }]
      }

input_boolean:
  guest_mode:
    name: Guest Mode
    initial: false
    icon: mdi:account-multiple

automation: !include_dir_list automations
script: !include_dir_merge_named scripts
scene: !include_dir_list scenes

logger:
  default: info
