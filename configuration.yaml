default_config:

frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  dashboards:
    lovelace-home:
      mode: yaml
      filename: lovelace/home.yaml
      title: Home
      icon: mdi:home-outline

homekit:
  filter:
    include_entities:
      - script.hello
      - script.goodbye

shell_command:
  git_pull_config: "git -C /config pull --rebase"

# Scraped by the otel-collector add-on via the Supervisor proxy, then forwarded
# to Dynatrace as OTLP metrics. Entity labels survive as dimensions.
prometheus:
  namespace: hass
  filter:
    exclude_entity_globs:
      # Street-level location — deliberately not shipped off-box.
      - sensor.*_geocoded_location
      # Always empty or unavailable; pure noise.
      - sensor.*_color_options

# Dynatrace event ingest, used for deploy markers. Requires events.ingest scope.
# dynatrace_events_url and dynatrace_auth_header live in secrets.yaml (untracked).
rest_command:
  dynatrace_event:
    url: !secret dynatrace_events_url
    method: POST
    headers:
      Authorization: !secret dynatrace_auth_header
    content_type: "application/json"
    # to_json quotes and escapes — detail carries raw command output, which
    # would otherwise break the body on a quote or newline.
    payload: >-
      {
        "eventType": {{ event_type | default('CUSTOM_INFO') | to_json }},
        "title": {{ title | to_json }},
        "properties": {
          "source": "home-assistant",
          "detail": {{ detail | default('') | string | to_json }}
        }
      }

input_boolean:
  guest_mode:
    name: Guest Mode
    initial: false
    icon: mdi:account-multiple

automation: !include_dir_list automations
script: !include_dir_merge_named scripts
scene: !include_dir_list scenes

logger:
  default: info
