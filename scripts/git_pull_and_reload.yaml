git_pull_and_reload:
  alias: Git Pull & Reload YAML
  sequence:
  - service: shell_command.git_pull_config
    response_variable: git_output
  - service: system_log.write
    data:
      message: "Git pull output: {{ git_output }}"
      level: info
  # Best-effort: a Dynatrace outage must never block a deploy.
  - service: script.dynatrace_event
    continue_on_error: true
    data:
      title: Home Assistant config deployed
      event_type: CUSTOM_DEPLOYMENT
      detail: "{{ git_output.stdout | default('') }}"
  - delay: "00:00:02"
  - service: homeassistant.reload_all
  mode: single
