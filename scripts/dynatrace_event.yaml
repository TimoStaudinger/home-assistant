dynatrace_event:
  alias: Send Dynatrace Event
  description: Posts an event to Dynatrace so it annotates charts and can trigger alerts.
  fields:
    title:
      description: Event title shown in Dynatrace
      required: true
      example: Config deployed
      selector:
        text:
    event_type:
      description: Dynatrace event type
      example: CUSTOM_DEPLOYMENT
      selector:
        select:
          options:
            - CUSTOM_INFO
            - CUSTOM_DEPLOYMENT
            - CUSTOM_ANNOTATION
            - CUSTOM_ALERT
            - ERROR_EVENT
    detail:
      description: Free-text detail attached as a property
      example: git pull output
      selector:
        text:
  sequence:
  - service: rest_command.dynatrace_event
    data:
      title: "{{ title }}"
      event_type: "{{ event_type | default('CUSTOM_INFO') }}"
      detail: "{{ detail | default('') }}"
  mode: parallel
